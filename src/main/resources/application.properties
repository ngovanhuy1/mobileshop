# Port chạy ứng dụng Spring Boot
server.port=8080

# Cấu hình kết nối Oracle Database XE 
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:ORCLL3
spring.datasource.username=c##spring_user
spring.datasource.password=123456
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Cấu hình Hibernate tự động cập nhật bảng và hiển thị câu lệnh SQL
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true