<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đơn Hàng Của Tôi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">📦 Lịch Sử Đơn Hàng</h2>
            <a href="/" class="btn btn-outline-dark">Về Trang Chủ</a>
        </div>
        <div class="card shadow-sm border-0 mb-4" th:each="order : ${orders}">
            <div class="card-header bg-dark text-white d-flex justify-content-between">
                <span>Mã đơn: <strong th:text="'#' + ${order.id}"></strong></span>
                <span>Trạng thái: <span class="badge bg-warning text-dark" th:text="${order.status}"></span></span>
            </div>
            <div class="card-body">
                <table class="table table-sm">
                    <thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th>Số lượng</th><th>Thành tiền</th></tr></thead>
                    <tbody>
                        <tr th:each="item : ${order.orderItems}">
                            <td th:text="${item.product.name}"></td>
                            <td th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td th:text="${item.quantity}"></td>
                            <td class="fw-bold" th:text="${#numbers.formatDecimal(item.price * item.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
