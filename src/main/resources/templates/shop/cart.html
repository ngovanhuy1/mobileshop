<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ Hàng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h2 class="mb-4 fw-bold">🛒 Giỏ Hàng Của Bạn</h2>
        <div class="card shadow-sm border-0">
            <div class="card-body">
                <table class="table align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Sản phẩm</th>
                            <th>Giá</th>
                            <th>Số lượng</th>
                            <th>Thành tiền</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${cart}">
                            <td class="fw-bold" th:text="${item.product.name}"></td>
                            <td class="text-danger" th:text="${#numbers.formatDecimal(item.product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <form action="/cart/update" method="post" class="d-flex align-items-center">
                                    <input type="hidden" name="productId" th:value="${item.product.id}">
                                    <input type="number" name="quantity" th:value="${item.quantity}" min="1" class="form-control form-control-sm me-2" style="width: 70px;">
                                    <button type="submit" class="btn btn-sm btn-outline-secondary">Cập nhật</button>
                                </form>
                            </td>
                            <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(item.totalPrice, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td><a th:href="@{/cart/remove/{id}(id=${item.product.id})}" class="btn btn-danger btn-sm">Xóa</a></td>
                        </tr>
                    </tbody>
                </table>
                <div class="d-flex justify-content-between align-items-center mt-4">
                    <a href="/" class="btn btn-outline-dark">← Tiếp tục mua sắm</a>
                    <div class="text-end">
                        <h4 class="fw-bold">Tổng tiền: <span class="text-danger" th:text="${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')} + ' đ'"></span></h4>
                        <form action="/checkout" method="post" class="mt-3">
                            <button type="submit" class="btn btn-warning btn-lg px-5 fw-bold" th:disabled="${#lists.isEmpty(cart)}">Đặt Hàng Ngay</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
