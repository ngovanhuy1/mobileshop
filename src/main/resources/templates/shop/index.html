<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mobile Store - Điện Thoại & Phụ Kiện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="/">📱 MOBILE STORE</a>
            <form class="d-flex mx-auto w-50" action="/" method="get">
                <input class="form-control me-2" type="search" name="keyword" placeholder="Tìm kiếm sản phẩm..." th:value="${param.keyword}">
                <button class="btn btn-warning" type="submit">Tìm</button>
            </form>
            <div class="navbar-nav ms-auto align-items-center">
                <a class="nav-link text-white me-3" href="/cart"><i class="bi bi-cart-fill text-warning"></i> Giỏ hàng</a>
                <div th:if="${session.currentUser == null}">
                    <a href="/login" class="btn btn-outline-light btn-sm me-2">Đăng Nhập</a>
                    <a href="/register" class="btn btn-warning btn-sm">Đăng Ký</a>
                </div>
                <div th:if="${session.currentUser != null}" class="dropdown">
                    <button class="btn btn-dark dropdown-toggle text-warning" data-bs-toggle="dropdown" th:text="${session.currentUser.fullName}"></button>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li><a class="dropdown-item" href="/orders">Đơn hàng</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item text-danger" href="/logout">Đăng xuất</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-3 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-warning fw-bold">Bộ Lọc Sản Phẩm</div>
                    <div class="card-body">
                        <form action="/" method="get">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Danh mục</label>
                                <select name="categoryId" class="form-select" onchange="this.form.submit()">
                                    <option value="">Tất cả</option>
                                    <option th:each="cat : ${categories}" 
                                            th:value="${cat.id}" 
                                            th:text="${cat.name}"
                                            th:selected="${cat.id == selectedCategoryId}">
                                    </option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Thương hiệu</label>
                                <input type="text" name="brand" class="form-control" placeholder="Apple, Samsung..." th:value="${param.brand}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Khoảng giá</label>
                                <input type="number" name="minPrice" class="form-control mb-2" placeholder="Từ giá" th:value="${param.minPrice}">
                                <input type="number" name="maxPrice" class="form-control" placeholder="Đến giá" th:value="${param.maxPrice}">
                            </div>
                            <button type="submit" class="btn btn-dark w-100">Lọc Ngay</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-9">
                <div class="row row-cols-1 row-cols-md-3 g-4">
                    <div class="col" th:each="product : ${products}">
                        <div class="card h-100 shadow-sm border-0">
                            <img th:src="${product.imageUrl}" class="card-img-top p-3" style="height: 200px; object-fit: contain;">
                            <div class="card-body d-flex flex-column">
                                <span class="badge bg-secondary mb-2 align-self-start" th:text="${product.brand}"></span>
                                <h6 class="card-title fw-bold" th:text="${product.name}"></h6>
                                <p class="text-danger fw-bold fs-5 mb-2" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + ' đ'"></p>
                                <form action="/cart/add" method="post" class="mt-auto">
                                    <input type="hidden" name="productId" th:value="${product.id}">
                                    <button type="submit" class="btn btn-outline-dark w-100"><i class="bi bi-cart-plus"></i> Thêm vào giỏ</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
