<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng Ký</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 400px;">
    <h3 class="text-center fw-bold mb-4 text-warning">ĐĂNG KÝ</h3>
    <form action="/register" method="post">
        <div class="mb-2"><label class="form-label">Username</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Password</label><input type="password" name="password" class="form-control" required></div>
        <div class="mb-2"><label class="form-label">Họ tên</label><input type="text" name="fullName" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Số điện thoại</label><input type="text" name="phone" class="form-control"></div>
        <button type="submit" class="btn btn-warning w-100 fw-bold mb-3">Đăng Ký</button>
        <p class="text-center">Đã có tài khoản? <a href="/login">Đăng nhập</a></p>
    </form>
</div>
</body>
</html>
