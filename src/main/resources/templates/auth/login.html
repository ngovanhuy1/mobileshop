<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Đăng Nhập</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
<div class="card shadow-sm p-4" style="width: 400px;">
    <h3 class="text-center fw-bold mb-4 text-warning">ĐĂNG NHẬP</h3>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
    <form action="/login" method="post">
        <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input type="text" name="username" class="form-control" required></div>
        <div class="mb-3"><label class="form-label">Mật khẩu</label><input type="password" name="password" class="form-control" required></div>
        <button type="submit" class="btn btn-warning w-100 fw-bold mb-3">Đăng Nhập</button>
        <p class="text-center">Chưa có tài khoản? <a href="/register">Đăng ký</a></p>
    </form>
</div>
</body>
</html>
